# Render Blueprint -- deploys this app as 5 services (plus 4 cron jobs, below):
#   1. siteforge-db       Postgres (managed)
#   2. siteforge-redis    Key Value / Redis-compatible (managed)
#   3. siteforge-api      Flask backend (Docker, gunicorn)
#   4. siteforge-worker   Celery worker (same image, different command)
#   5. siteforge-web      React frontend (static site)
#
# What this file does NOT set up, and why:
#
#   - Object storage (S3_ENDPOINT_URL / S3_BUCKET / S3_BACKUP_BUCKET /
#     S3_ACCESS_KEY / S3_SECRET_KEY): Render has no managed
#     S3-compatible service. Document storage (app/documents/) and
#     the backup upload step (backend/scripts/upload_backup_to_s3.py)
#     both need a real external provider -- AWS S3, Cloudflare R2,
#     Backblaze B2, or DigitalOcean Spaces all work, since the app
#     only needs an S3-compatible API. Fill in the four `sync: false`
#     placeholders on siteforge-api once you have one.
#
#   - Celery beat: still not run as a service (it needs a long-lived
#     worker, which Render's free tier doesn't offer). Scheduling is
#     instead done by the four Render Cron Jobs near the bottom of
#     this file, each of which starts this same image, runs ONE
#     command and exits: the scheduled tasks from the beat schedule
#     (backend/scripts/run_scheduled_task.py) and the nightly
#     database backup (backend/scripts/backup.sh). Cron Jobs have no
#     free plan on Render -- they are the one paid addition here
#     (`starter`, billed per run-minute with a small monthly minimum).
#     Delete a job's block to opt out of it.
#
#   - ANTHROPIC_API_KEY (Module 25, AI Assistant): left as sync:false;
#     the module works without it, just without live LLM calls.
#
# Before applying: run `render blueprints validate` (Render CLI
# v2.7.0+) from the repo root to catch anything that's drifted from
# Render's current schema since this was written.

databases:
  - name: siteforge-db
    # FREE TIER, deliberately, so this can deploy without payment
    # info on file -- but Render hard-deletes free Postgres after 30
    # days with NO warning. Fine for testing the deploy actually
    # works end-to-end; do not leave real data here past that window.
    # Switch to `starter` (~$7/mo) before this holds anything you
    # care about keeping.
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # --- Redis-compatible cache/broker ---
  - type: keyvalue
    name: siteforge-redis
    plan: free  # see the siteforge-db note above -- same "fine for testing, upgrade before real use" logic applies
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []  # Render services in the same region/workspace reach it over the private network; no public access needed.

  # --- Backend API ---
  - type: web
    name: siteforge-api
    runtime: docker
    region: oregon
    # FREE TIER -- spins down after 15 min idle, ~30-60s cold start on
    # the next request. Fine for testing; switch to `starter` (~$7/mo)
    # once you don't want visitors seeing that delay.
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /v1/health
    # No dockerCommand override here on purpose -- three real problems
    # in sequence made that field too unreliable to build on:
    # (1) preDeployCommand isn't supported on free-tier services;
    # (2) startCommand isn't valid for runtime: docker (that field is
    # for Render's own buildpack runtimes; dockerCommand is the
    # equivalent for a service with its own Dockerfile);
    # (3) even dockerCommand doesn't reliably get shell-interpreted --
    # a real deploy showed `&&` being handed to `flask` as a literal
    # argument rather than chaining commands ("Error: No such option
    # '-w'"), and it was genuinely unclear whether wrapping in
    # `sh -c "..."` would survive Render's own string-splitting intact
    # rather than being mis-split itself.
    # Migration + gunicorn now run via backend/docker-entrypoint.sh,
    # baked into the image as the Dockerfile's own CMD -- a single
    # script path has no internal whitespace for anything upstream of
    # Docker to mis-split, which sidesteps the whole class of problem
    # rather than fighting it further.
    envVars:
      - key: FLASK_APP
        value: wsgi:app
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: siteforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: siteforge-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: siteforge-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: siteforge-redis
          property: connectionString
      # Real fix for a real constraint documented above (no worker
      # service on the free tier): set this to "true" so every
      # .delay() call (invitation emails, notifications) runs
      # synchronously, in-process, instead of being queued for a
      # worker that doesn't exist and silently never sending. Set
      # back to "false" (or remove this line) once siteforge-worker
      # is added back on a paid plan -- true async is the better
      # long-term shape, this is the legitimate free-tier stand-in.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      # Set to the real siteforge-web URL once that service exists
      # (Render assigns the .onrender.com URL on first deploy) --
      # see app/config.py's CORS_ORIGINS comment for what happens if
      # this is left as "*" in production.
      - key: CORS_ORIGINS
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_BACKUP_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # --- Celery worker: DELIBERATELY NOT in this Blueprint ---
  # Render rejected it outright: "service type is not available for
  # this plan" -- unlike siteforge-db/redis/api (which have real free
  # tiers), background worker services require at least the Starter
  # paid plan on Render, full stop. No YAML change fixes this.
  #
  # Impact of leaving it out: the app's request/response paths (every
  # module's CRUD, auth, everything the frontend calls directly) work
  # completely normally without it. What doesn't run is
  # app/modules/inv/tasks.py's reorder-check task -- and per this
  # file's own top-of-file note, nothing was scheduling that task
  # automatically yet anyway (no Celery beat set up), so this doesn't
  # regress anything that was actually working. (The scheduled tasks
  # themselves are now triggered by the cron jobs further down, which
  # call them directly and don't need this worker.)
  #
  # To add it back once you're ready to put a paid plan on this one
  # service specifically: the full service definition (type: worker,
  # same Dockerfile, `celery -A app.celery_app.celery worker` as its
  # dockerCommand, same env vars as siteforge-api) is preserved in
  # this repo's git history at commit 6f7b89f, or ask whoever's
  # maintaining this to regenerate it -- it's a small, mechanical
  # addition once plan: starter is acceptable.

  # --- Scheduled jobs (Render Cron Jobs) -------------------------------
  # Schedules are UTC. Lagos is UTC+1, so e.g. "0 2 * * *" = 03:00 WAT.
  #
  # Each job runs the same image as siteforge-api with a different
  # dockerCommand. dockerCommand is whitespace-split by Render and NOT
  # run through a shell (see the note on siteforge-api above), so every
  # command here is a plain argv with no &&, pipes or quoting.
  #
  # CELERY_TASK_ALWAYS_EAGER stays "true": run_scheduled_task.py calls
  # the task function directly and needs no broker or worker.
  #
  # Failures are visible: run_scheduled_task.py exits non-zero if the
  # task reports ANY per-tenant error, and backup.sh runs under
  # `set -e`, so Render shows the run as failed rather than green.

  # INV-05: raise draft Purchase Requests for items below reorder point.
  - type: cron
    name: siteforge-cron-reorder-check
    runtime: docker
    region: oregon
    plan: starter
    schedule: "0 5 * * *"   # 06:00 WAT
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m scripts.run_scheduled_task inv.check_and_create_reorder_purchase_requests
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: siteforge-db
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: SENTRY_DSN
        sync: false

  # EQP-12: apply approved equipment-transfer cost cutovers that are due.
  - type: cron
    name: siteforge-cron-equipment-cutovers
    runtime: docker
    region: oregon
    plan: starter
    schedule: "10 0 * * *"   # 01:10 WAT, just after the date rolls over
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m scripts.run_scheduled_task eqp.apply_due_transfer_cutovers
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: siteforge-db
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: SENTRY_DSN
        sync: false

  # Workflow engine: escalate approval steps that are past their due
  # date (only steps with auto_escalate on and an escalation target).
  - type: cron
    name: siteforge-cron-workflow-escalation
    runtime: docker
    region: oregon
    plan: starter
    schedule: "5 * * * *"   # hourly -- step timeouts are measured in hours
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m scripts.run_scheduled_task workflow.escalate_overdue_approvals
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: siteforge-db
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Nightly pg_dump -> verified upload to the S3-compatible backup bucket.
  # Needs the same four S3_* values as siteforge-api (set them in the
  # dashboard after the first apply -- they are sync:false on purpose).
  # Without them the upload step fails and the job is marked failed,
  # which is the intended loud behaviour: an unconfigured backup must
  # not look like a working one.
  - type: cron
    name: siteforge-cron-db-backup
    runtime: docker
    region: oregon
    plan: starter
    schedule: "0 2 * * *"   # 03:00 WAT
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: bash scripts/backup.sh /tmp/backups
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: siteforge-db
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BACKUP_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # --- Frontend (static site, NOT the dev-mode Dockerfile) ---
  - type: web
    name: siteforge-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the compiled JS bundle AT BUILD TIME (see
      # src/api/client.ts and src/vite-env.d.ts) -- frontend and
      # backend are separate Render services with separate domains by
      # default, so this must be the real siteforge-api URL, not a
      # relative path. Set to
      # https://siteforge-api.onrender.com/v1 (or your actual backend
      # URL + /v1) once siteforge-api's URL is known -- Render assigns
      # it on first deploy, so this needs to be set (or corrected)
      # AFTER siteforge-api exists, then siteforge-web redeployed.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA routing -- every path that isn't a real static file falls
      # through to index.html, so client-side routing (react-router)
      # handles it instead of Render returning a 404.
      - type: rewrite
        source: /*
        destination: /index.html
