name: siteforge_mobile
description: SiteForge offline-first Mobile Field App (SRS Module 24).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  dio: ^5.5.0
  connectivity_plus: ^6.0.4
  uuid: ^4.4.2
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  camera: ^0.11.0+1
  mobile_scanner: ^5.1.1
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
